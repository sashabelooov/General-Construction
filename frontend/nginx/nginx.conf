worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression (smaller responses = faster loading)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Max upload size (for admin image uploads)
    client_max_body_size 20M;

    # Upstream: points to Django backend container
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # ------------------------------------------
        # 1. API requests → Django backend
        # ------------------------------------------
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ------------------------------------------
        # 2. Admin panel → Django backend
        # ------------------------------------------
        location /admin/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------
        # 3. Django static files (admin CSS/JS)
        # ------------------------------------------
        location /static/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # ------------------------------------------
        # 4. Media files (uploaded images)
        # ------------------------------------------
        location /media/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;

            # Cache media files in browser for 30 days
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ------------------------------------------
        # 5. WebSocket connections (for leads chat)
        # ------------------------------------------
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # ------------------------------------------
        # 6. Frontend (React SPA) — must be last!
        # ------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;

            # This is the key for SPA routing:
            # If the file doesn't exist, serve index.html
            # so React Router can handle the route client-side
            try_files $uri $uri/ /index.html;

            # Cache static assets (JS, CSS, images) for 1 year
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
