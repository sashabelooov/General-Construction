# ============================================================
# General Construction - CI/CD Pipeline
# ============================================================
# Triggers:
#   - Push to production → runs tests + deploys to production
#   - Pull request       → runs tests only (no deploy)
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

env:
  DOCKER_BUILDKIT: 1

jobs:
  # ========================================
  # Job 1: Test Backend (Django)
  # ========================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        env:
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: "1"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: |
          python manage.py check
          python manage.py migrate --noinput

  # ========================================
  # Job 2: Build Frontend (React/Vite)
  # ========================================
  test-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ========================================
  # Job 3: Deploy to AWS EC2
  # ========================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]    # Only deploy if both tests pass

    # Only deploy on push to production (not on pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Navigate to project directory
            cd ~/General-Construction

            # Pull latest code
            echo "==> Pulling latest code..."
            git fetch origin production
            git reset --hard origin/production

            # Build and restart containers (using production override)
            # IMPORTANT: "down" without -v keeps database volumes intact
            echo "==> Building and starting containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

            # Wait for services to be healthy
            echo "==> Waiting for services to start..."
            sleep 20

            # Verify deployment
            echo "==> Checking service health..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
            curl -f http://localhost/api/v1/ || echo "WARNING: Backend health check failed"
            curl -f http://localhost/ || echo "WARNING: Frontend health check failed"

            # Clean up old Docker images
            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Deployment complete!"
